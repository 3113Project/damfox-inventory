services:

  db:
    image: postgres:17
    container_name: damfox-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: damfox
      POSTGRES_USER: damfox
      POSTGRES_PASSWORD: damfox

    volumes:
      - ./postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damfox -d damfox"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    build: ./backend

    env_file:
      - ./backend/.env

    environment:
      CORS_ORIGINS: http://localhost:15173

    container_name: damfox-backend

    restart: unless-stopped

    ports:
      - "18000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: damfox-frontend
    restart: unless-stopped

    environment:
      VITE_API_BASE_URL: http://localhost:18000

    ports:
      - "15173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      backend:
        condition: service_healthy
